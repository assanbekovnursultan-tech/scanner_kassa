<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Сканер штрихкодов</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #1a1a1a; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        #video-wrap { position: relative; flex: 1; background: #000; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        /* Квадратная зеленая рамка */
        #overlay { 
            position: absolute; top: 50%; left: 50%; 
            transform: translate(-50%, -50%); 
            width: min(75vw, 75vh, 340px); /* Адаптивный размер квадрата */
            aspect-ratio: 1 / 1;           /* Делаем квадрат */
            border: 3px solid #00ff88; border-radius: 8px; 
            box-shadow: 0 0 0 9999px rgba(0,0,0,0.5); 
            pointer-events: none; z-index: 5; 
        }
        
        #torch-btn { position: absolute; top: 16px; right: 16px; width: 56px; height: 56px; border-radius: 50%; background: rgba(0,0,0,0.6); color: #fff; border: 2px solid rgba(255,255,255,0.3); font-size: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10; }
        #torch-btn.active { background: #ffcc00; color: #000; }
        #status { position: absolute; top: 16px; left: 16px; background: rgba(0,0,0,0.7); padding: 8px 16px; border-radius: 20px; font-size: 14px; z-index: 10; max-width: 60%; }
        
        #list { background: #222; max-height: 35vh; overflow-y: auto; border-top: 1px solid #333; z-index: 10; }
        #list:empty { display: none; }
        .item { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid #333; font-size: 15px; cursor: pointer; gap: 8px; }
        .item:active { background: #333; }
        .item .info { flex: 1; min-width: 0; }
        .item .name { color: #fff; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .item .code { color: #00ff88; font-family: monospace; font-size: 12px; opacity: 0.7; }
        .item .qty { font-weight: bold; color: #ffcc00; background: #333; padding: 4px 10px; border-radius: 4px; flex-shrink: 0; }
        .item .del { background: #ff4444; color: #fff; border: none; width: 28px; height: 28px; border-radius: 50%; font-size: 16px; cursor: pointer; line-height: 1; flex-shrink: 0; }
        
        #actions { display: flex; gap: 8px; padding: 12px; background: #222; border-top: 1px solid #333; z-index: 10; }
        #actions button { flex: 1; padding: 14px; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; background: #3a7bd5; color: #fff; }
        #actions button:disabled { opacity: 0.4; cursor: not-allowed; }
        #actions button.primary { background: #00aa55; }
        #actions button.warn { background: #ff8800; }
        
        #error { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(200,0,0,0.95); padding: 20px; border-radius: 12px; text-align: center; max-width: 80%; z-index: 20; }
    </style>
</head>
<body>
    <div id="video-wrap">
        <video id="video" autoplay muted playsinline></video>
        <div id="overlay"></div>
        <div id="status">Загрузка каталога…</div>
        <button id="torch-btn" style="display:none;">🔦</button>
        <div id="error" style="display:none;"></div>
    </div>
    <div id="list"></div>
    <div id="actions">
        <button id="manual-btn" class="warn">⌨️ Ввести</button>
        <button id="send-btn" class="primary" disabled>📤 Отправить (0)</button>
    </div>

<script>
    // Ссылка на каталог (твоя Google Таблица)
    const CATALOG_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQPB1XAYLQrEnvmwCKjLvOXOZKEqXMDrD3JAvsFiyvG2mnA_k9YSJXxaiVOikuwxE7PG7ACXcnfWYLy/pub?gid=1294329108&single=true&output=csv";

    const tg = window.Telegram.WebApp;
    tg.expand(); tg.ready();

    let scannedMap = {};
    let currentlyVisible = new Map();
    let catalogMap = new Map();
    let torchOn = false;
    let torchSupported = false;
    let detector = null;
    let videoStream = null;
    let videoTrack = null;
    let scanning = true;

    // Аудио
    let audioCtx = null;
    function initAudio() {
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        } catch(e) {}
    }
    function beep() {
        if (!audioCtx) return;
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.frequency.value = 1100; gain.gain.value = 0.15;
            osc.start(); osc.stop(audioCtx.currentTime + 0.08);
        } catch(e) {}
    }
    function vibrate() { try { navigator.vibrate && navigator.vibrate(80); } catch(e) {} }

    const video = document.getElementById('video');
    const overlay = document.getElementById('overlay');
    const list = document.getElementById('list');
    const status = document.getElementById('status');
    const torchBtn = document.getElementById('torch-btn');
    const sendBtn = document.getElementById('send-btn');
    const manualBtn = document.getElementById('manual-btn');
    const errorBox = document.getElementById('error');

    function showError(text) { errorBox.textContent = text; errorBox.style.display = 'block'; }

    // Загрузка каталога
    async function loadCatalog() {
        if (!CATALOG_CSV_URL || CATALOG_CSV_URL.includes("ВСТАВЬ_СЮДА")) return false;
        try {
            const resp = await fetch(CATALOG_CSV_URL, { cache: "no-store" });
            if (!resp.ok) throw new Error("HTTP " + resp.status);
            const text = await resp.text();
            const rows = parseCSV(text);
            if (rows.length < 2) return false;
            const header = rows[0].map(h => String(h).trim().toLowerCase());
            const iSku = header.findIndex(h => h.includes("артикул"));
            const iName = header.findIndex(h => h.includes("название"));
            const iPrice = header.findIndex(h => h.includes("цена розница") || h === "цена");
            const iStock = header.findIndex(h => h.includes("остаток"));
            const iBc = header.findIndex(h => h.includes("штрихкод"));
            for (let i = 1; i < rows.length; i++) {
                const r = rows[i];
                if (r.length < 2) continue;
                const bc = (r[iBc] || "").trim();
                if (!bc) continue;
                catalogMap.set(bc, {
                    sku: (r[iSku] || "").trim(),
                    name: (r[iName] || "").trim() || "Без названия",
                    price: parseFloat((r[iPrice] || "0").replace(",", ".")) || 0,
                    stock: parseFloat((r[iStock] || "0").replace(",", ".")) || 0,
                });
            }
            return true;
        } catch (e) { return false; }
    }

    function parseCSV(text) {
        const rows = []; let row = [], cur = "", inQuotes = false;
        for (let i = 0; i < text.length; i++) {
            const c = text[i];
            if (inQuotes) {
                if (c === '"') { if (text[i+1] === '"') { cur += '"'; i++; } else inQuotes = false; } 
                else cur += c;
            } else {
                if (c === '"') inQuotes = true;
                else if (c === ',') { row.push(cur); cur = ""; }
                else if (c === '\n' || c === '\r') {
                    if (cur || row.length) { row.push(cur); rows.push(row); row = []; cur = ""; }
                    if (c === '\r' && text[i+1] === '\n') i++;
                } else cur += c;
            }
        }
        if (cur || row.length) { row.push(cur); rows.push(row); }
        return rows;
    }

    // Валидация EAN
    function isValidEAN13(code) {
        if (!/^\d{13}$/.test(code)) return false;
        let sum = 0;
        for (let i = 0; i < 12; i++) sum += parseInt(code[i]) * (i % 2 === 0 ? 1 : 3);
        return (10 - (sum % 10)) % 10 === parseInt(code[12]);
    }
    function isValidEAN8(code) {
        if (!/^\d{8}$/.test(code)) return false;
        let sum = 0;
        for (let i = 0; i < 7; i++) sum += parseInt(code[i]) * (i % 2 === 0 ? 3 : 1);
        return (10 - (sum % 10)) % 10 === parseInt(code[7]);
    }
    function isValidBarcode(code) {
        if (code.length === 13) return isValidEAN13(code);
        if (code.length === 8) return isValidEAN8(code);
        if (code.length >= 4 && code.length <= 30) return true;
        return false;
    }

    // Проверка на попадание в квадратную рамку
    function isInsideOverlay(barcodeBox) {
        if (!barcodeBox) return true; 
        
        const videoRect = video.getBoundingClientRect();
        const overlayRect = overlay.getBoundingClientRect();

        const videoAspect = video.videoWidth / video.videoHeight;
        const rectAspect = videoRect.width / videoRect.height;

        let renderedWidth, renderedHeight, offsetX, offsetY;

        if (videoAspect > rectAspect) {
            renderedHeight = videoRect.height;
            renderedWidth = renderedHeight * videoAspect;
            offsetX = (videoRect.width - renderedWidth) / 2;
            offsetY = 0;
        } else {
            renderedWidth = videoRect.width;
            renderedHeight = renderedWidth / videoAspect;
            offsetX = 0;
            offsetY = (videoRect.height - renderedHeight) / 2;
        }

        const scaleX = renderedWidth / video.videoWidth;
        const scaleY = renderedHeight / video.videoHeight;

        const bcCenterX = videoRect.left + offsetX + (barcodeBox.x + barcodeBox.width / 2) * scaleX;
        const bcCenterY = videoRect.top + offsetY + (barcodeBox.y + barcodeBox.height / 2) * scaleY;

        return (
            bcCenterX >= overlayRect.left &&
            bcCenterX <= overlayRect.right &&
            bcCenterY >= overlayRect.top &&
            bcCenterY <= overlayRect.bottom
        );
    }

    async function processCodes(detectedCodes) {
        const now = Date.now();
        let changed = false;
        let lastAddedCode = null;

        for (const c of detectedCodes) {
            const code = String(c.rawValue).trim();
            if (!code) continue;
            if (c.format && c.format !== 'ean_13' && c.format !== 'ean_8' && c.format !== 'code_128' && c.format !== 'code_39') continue;
            if (!isValidBarcode(code)) continue;
            if (!isInsideOverlay(c.boundingBox)) continue;


            // 2. ЕСЛИ ТОВАРА ЕЩЕ НЕТ В СПИСКЕ (или он другой)
            if (!scannedMap[code]) {
                scannedMap[code] = 1;
                currentlyVisible.set(code, now);
                changed = true;
                lastAddedCode = code;
                beep(); vibrate();
                continue; // Мгновенно добавляем и идем к следующему
            }

            // 3. ЕСЛИ ЭТОТ ТОВАР УЖЕ ЕСТЬ (защита от дублей)
            const lastSeen = currentlyVisible.get(code);
            if (lastSeen !== undefined && now - lastSeen < 1000) {
                currentlyVisible.set(code, now);
                continue; // Ждем 1 секунду, если навели на тот же товар
            }

            // Прошла 1 секунда, добавляем еще одну штуку этого же товара
            scannedMap[code] += 1;
            currentlyVisible.set(code, now);
            changed = true;
            lastAddedCode = code;
            beep(); vibrate();
        }

        // Обновляем интерфейс только если реально что-то добавилось
        if (changed && lastAddedCode) {
            const prod = catalogMap.get(lastAddedCode);
            status.textContent = prod ? `✅ ${prod.name}` : `⚠️ ${lastAddedCode} (нет в каталоге)`;
            renderList();
            updateSendBtn();
        }

        // Чистим старые коды
        for (const [code, t] of currentlyVisible) { 
            if (now - t > 10000) currentlyVisible.delete(code); 
        }
    }

    function editQty(code) {
        const prod = catalogMap.get(code);
        const label = prod ? prod.name : code;
        const current = scannedMap[code] || 1;
        const input = prompt(`Сколько "${label}"?\nМожно дробное, например 2.5`, current);
        if (input === null) return;
        const val = parseFloat(input.replace(",", "."));
        if (isNaN(val) || val <= 0) { alert("Введите число больше нуля"); return; }
        scannedMap[code] = val; renderList(); updateSendBtn();
    }

    function renderList() {
        list.innerHTML = '';
        Object.keys(scannedMap).forEach(code => {
            const prod = catalogMap.get(code);
            const div = document.createElement('div');
            div.className = 'item';
            div.onclick = (e) => { if (e.target.tagName !== 'BUTTON') editQty(code); };
            const nameHtml = prod
                ? `<div class="name">${prod.name}</div><div class="code">${code} · ${prod.price}₸ · ост: ${prod.stock}</div>`
                : `<div class="name" style="color:#ffaa00">⚠️ Нет в каталоге</div><div class="code">${code}</div>`;
            div.innerHTML = `<div class="info">${nameHtml}</div><span class="qty">${scannedMap[code]} шт.</span>`;
            const del = document.createElement('button');
            del.className = 'del'; del.textContent = '×';
            del.onclick = (e) => { e.stopPropagation(); delete scannedMap[code]; renderList(); updateSendBtn(); };
            div.appendChild(del); list.appendChild(div);
        });
    }

    function updateSendBtn() {
        const total = Object.values(scannedMap).reduce((a, b) => a + b, 0);
        sendBtn.textContent = `📤 Отправить (${total})`;
        sendBtn.disabled = total === 0;
    }

    async function initCamera() {
        try {
            videoStream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }
            });
            video.srcObject = videoStream;
            videoTrack = videoStream.getVideoTracks()[0];
            const caps = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
            
            torchSupported = !!caps.torch;
            if (torchSupported) torchBtn.style.display = 'flex';
            
            const constraints = { advanced: [] };
            if (caps.focusMode && caps.focusMode.includes('continuous')) {
                constraints.advanced.push({ focusMode: 'continuous' });
            }
            if (caps.zoom && caps.zoom.max > 1) {
                constraints.advanced.push({ zoom: Math.min(2.0, caps.zoom.max) });
            }
            if (constraints.advanced.length > 0) {
                await videoTrack.applyConstraints(constraints);
            }
        } catch (e) { showError('Нет доступа к камере: ' + e.message); return false; }
        return true;
    }

    async function initDetector() {
        if ('BarcodeDetector' in window) {
            try {
                const formats = await BarcodeDetector.getSupportedFormats();
                const need = ['ean_13', 'ean_8', 'code_128', 'code_39', 'upc_a', 'upc_e', 'itf'];
                const supported = need.filter(f => formats.includes(f));
                detector = new BarcodeDetector({ formats: supported });
                return true;
            } catch(e) { return false; }
        }
        return false;
    }

    async function scanLoop() {
        while (scanning) {
            if (video.readyState >= 2 && !video.paused && !video.ended && detector) {
                try {
                    const codes = await detector.detect(video);
                    if (codes.length > 0) await processCodes(codes);
                } catch(e) {}
            }
            await new Promise(r => setTimeout(r, 30));
        }
    }

    function startFallback() {
        const fb = document.createElement('div');
        fb.id = 'fallback-reader';
        fb.style.cssText = 'position:absolute;inset:0;z-index:5;';
        document.getElementById('video-wrap').appendChild(fb);
        video.style.display = 'none';
        overlay.style.display = 'none';
        status.textContent = 'iOS режим';
        const html5 = new Html5Qrcode('fallback-reader');
        html5.start(
            { facingMode: 'environment' },
            { fps: 10, qrbox: { width: 260, height: 260 } }, // Квадратная зона для iOS
            (text) => {
                const code = String(text).trim();
                if (isValidBarcode(code)) processCodes([{ rawValue: code }]);
            },
            () => {}
        ).catch(e => showError('Fallback: ' + e.message));
    }

    torchBtn.onclick = async () => {
        if (!torchSupported || !videoTrack) return;
        try {
            torchOn = !torchOn;
            await videoTrack.applyConstraints({ advanced: [{ torch: torchOn }] });
            torchBtn.classList.toggle('active', torchOn);
        } catch(e) {}
    };
    manualBtn.onclick = () => {
        const code = prompt('Введите штрихкод:');
        if (code && code.trim()) {
            const c = code.trim();
            if (isValidBarcode(c)) processCodes([{ rawValue: c }]);
            else alert('Неверный формат штрихкода');
        }
    };
    sendBtn.onclick = () => {
        if (!scannedMap || Object.keys(scannedMap).length === 0) return;
        tg.sendData(JSON.stringify({ items: scannedMap }));
    };

    (async () => {
        initAudio();
        document.body.addEventListener('click', initAudio, { once: true });
        document.body.addEventListener('touchstart', initAudio, { once: true });

        const hasCatalog = await loadCatalog();
        status.textContent = hasCatalog
            ? `Каталог загружен (${catalogMap.size})`
            : "Каталог не загружен";

        if (!await initCamera()) return;
        const ok = await initDetector();
        if (ok) scanLoop();
        else startFallback();

        setInterval(async () => { if (await loadCatalog()) renderList(); }, 60000);
    })();
</script>
</body>
</html>
