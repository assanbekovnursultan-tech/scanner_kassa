<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Сканер штрихкодов</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1a1a1a; color: #fff;
            height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        }
        #video-wrap {
            position: relative; flex: 1;
            background: #000; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }
        video { width: 100%; height: 100%; object-fit: cover; }
        #overlay {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 75%; max-width: 340px;
            aspect-ratio: 2/1;
            border: 3px solid #00ff88; border-radius: 8px;
            box-shadow: 0 0 0 9999px rgba(0,0,0,0.4);
            pointer-events: none;
        }
        #torch-btn {
            position: absolute; top: 16px; right: 16px;
            width: 56px; height: 56px; border-radius: 50%;
            background: rgba(0,0,0,0.6); color: #fff;
            border: 2px solid rgba(255,255,255,0.3);
            font-size: 24px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            z-index: 10;
        }
        #torch-btn.active { background: #ffcc00; color: #000; }
        #status {
            position: absolute; top: 16px; left: 16px;
            background: rgba(0,0,0,0.7);
            padding: 8px 16px; border-radius: 20px;
            font-size: 14px; z-index: 10; max-width: 60%;
        }
        #list {
            background: #222; max-height: 32vh; overflow-y: auto;
            border-top: 1px solid #333;
        }
        #list:empty { display: none; }
        .item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 16px; border-bottom: 1px solid #333;
            font-size: 15px;
        }
        .item:last-child { border-bottom: none; }
        .item .code { color: #00ff88; font-weight: 600; font-family: monospace; }
        .item .del {
            background: #ff4444; color: #fff; border: none;
            width: 32px; height: 32px; border-radius: 50%;
            font-size: 18px; cursor: pointer; line-height: 1;
        }
        #actions {
            display: flex; gap: 8px; padding: 12px;
            background: #222; border-top: 1px solid #333;
        }
        #actions button {
            flex: 1; padding: 14px; border: none; border-radius: 8px;
            font-size: 15px; font-weight: 600; cursor: pointer;
            background: #3a7bd5; color: #fff;
        }
        #actions button:disabled { opacity: 0.4; cursor: not-allowed; }
        #actions button.primary { background: #00aa55; }
        #actions button.warn { background: #ff8800; }
        #error {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(200,0,0,0.95); padding: 20px; border-radius: 12px;
            text-align: center; max-width: 80%; z-index: 20;
        }
    </style>
</head>
<body>
    <div id="video-wrap">
        <video id="video" autoplay muted playsinline></video>
        <div id="overlay"></div>
        <div id="status">Готов к сканированию</div>
        <button id="torch-btn" style="display:none;">🔦</button>
        <div id="error" style="display:none;"></div>
    </div>
    <div id="list"></div>
    <div id="actions">
        <button id="manual-btn" class="warn">⌨️ Ввести</button>
        <button id="send-btn" class="primary" disabled>📤 Отправить (0)</button>
    </div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand(); tg.ready();

    const scanned = [];
    let torchOn = false;
    let torchSupported = false;
    let detector = null;
    let videoStream = null;
    let videoTrack = null;
    let scanning = true;
    let lastCode = "";
    let lastCodeTime = 0;

    const video = document.getElementById('video');
    const list = document.getElementById('list');
    const status = document.getElementById('status');
    const torchBtn = document.getElementById('torch-btn');
    const sendBtn = document.getElementById('send-btn');
    const manualBtn = document.getElementById('manual-btn');
    const errorBox = document.getElementById('error');

    function beep() {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            osc.frequency.value = 1100;
            gain.gain.value = 0.2;
            osc.start();
            setTimeout(() => { osc.stop(); ctx.close(); }, 80);
        } catch(e) {}
    }

    function vibrate() {
        try { navigator.vibrate && navigator.vibrate(80); } catch(e) {}
    }

    function showError(text) {
        errorBox.textContent = text;
        errorBox.style.display = 'block';
    }

    function addCode(code) {
        code = String(code).trim();
        if (!code) return;
        const now = Date.now();
        if (code === lastCode && now - lastCodeTime < 2000) return;
        lastCode = code; lastCodeTime = now;

        if (scanned.includes(code)) {
            status.textContent = `⚠️ Уже есть: ${code}`;
            return;
        }
        scanned.push(code);
        beep(); vibrate();
        status.textContent = `✅ ${code}`;
        renderList();
        updateSendBtn();
    }

    function renderList() {
        list.innerHTML = '';
        scanned.forEach((code, i) => {
            const div = document.createElement('div');
            div.className = 'item';
            div.innerHTML = `<span class="code">${code}</span>`;
            const del = document.createElement('button');
            del.className = 'del'; del.textContent = '×';
            del.onclick = () => {
                scanned.splice(i, 1);
                renderList();
                updateSendBtn();
            };
            div.appendChild(del);
            list.appendChild(div);
        });
    }

    function updateSendBtn() {
        sendBtn.textContent = `📤 Отправить (${scanned.length})`;
        sendBtn.disabled = scanned.length === 0;
    }

    async function initCamera() {
        try {
            videoStream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
            });
            video.srcObject = videoStream;
            videoTrack = videoStream.getVideoTracks()[0];
            const caps = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
            torchSupported = !!caps.torch;
            if (torchSupported) torchBtn.style.display = 'flex';
        } catch (e) {
            showError('Нет доступа к камере: ' + e.message);
            return false;
        }
        return true;
    }

    async function initDetector() {
        if ('BarcodeDetector' in window) {
            try {
                const formats = await BarcodeDetector.getSupportedFormats();
                const need = ['ean_13', 'ean_8', 'code_128', 'code_39',
                              'upc_a', 'upc_e', 'qr_code', 'itf'];
                const supported = need.filter(f => formats.includes(f));
                detector = new BarcodeDetector({ formats: supported });
                return true;
            } catch(e) { return false; }
        }
        return false;
    }

    async function scanLoop() {
        while (scanning) {
            if (video.readyState >= 2 && detector) {
                try {
                    const codes = await detector.detect(video);
                    for (const c of codes) addCode(c.rawValue);
                } catch(e) {}
            }
            await new Promise(r => setTimeout(r, 200));
        }
    }

    function startFallback() {
        const fb = document.createElement('div');
        fb.id = 'fallback-reader';
        fb.style.cssText = 'position:absolute;inset:0;z-index:5;';
        document.getElementById('video-wrap').appendChild(fb);
        video.style.display = 'none';
        document.getElementById('overlay').style.display = 'none';
        status.textContent = 'iOS режим (медленнее)';

        const html5 = new Html5Qrcode('fallback-reader');
        html5.start(
            { facingMode: 'environment' },
            { fps: 10, qrbox: { width: 260, height: 160 } },
            (text) => addCode(text),
            () => {}
        ).catch(e => showError('Fallback: ' + e.message));
    }

    torchBtn.onclick = async () => {
        if (!torchSupported || !videoTrack) return;
        try {
            torchOn = !torchOn;
            await videoTrack.applyConstraints({ advanced: [{ torch: torchOn }] });
            torchBtn.classList.toggle('active', torchOn);
        } catch(e) {}
    };

    manualBtn.onclick = () => {
        const code = prompt('Введите штрихкод:');
        if (code && code.trim()) addCode(code.trim());
    };

    sendBtn.onclick = () => {
        if (!scanned.length) return;
        const payload = scanned.length === 1 ? scanned[0] : JSON.stringify(scanned);
        tg.sendData(payload);
    };

    (async () => {
        if (!await initCamera()) return;
        const ok = await initDetector();
        if (ok) scanLoop();
        else startFallback();
    })();
</script>
</body>
</html>
